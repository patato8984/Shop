services:
  loki:
    image: grafana/loki:latest
    container_name: loki
    ports:
      - "3100:3100"
    volumes:
      - ./build/loki/loki-config.yml:/etc/loki/loki-config.yml
      - ./loki-data:/loki
    command: -config.file=/etc/loki/loki-config.yml

  promtail:
    image: grafana/promtail:latest
    volumes:
      - ./build/promtail/promtail-config.yml:/etc/promtail/config.yml
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_DASHBOARDS_MIN_REFRESH_INTERVAL=1s
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - loki
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BINARY_PATH: ./cmd/api
        CONFIG_PATH: ./configs/api.yml
    secrets:
      - shared_bank_key
      - jwt_key
    ports:
      - "8080:8080"
    depends_on:
      - redis
      - db
    volumes:
      - ./configs/apiAdmins.yml:/app/admins.yml
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
  cache-invalidator:
    build: 
      context: .
      dockerfile: Dockerfile
      args:
        BINARY_PATH: ./cmd/cacheInvalidator
        CONFIG_PATH: ./configs/cache.yml
  change-data-capture:
    build: 
      context: .
      dockerfile: Dockerfile
      args:
        BINARY_PATH: ./cmd/changeDataCapture
        CONFIG_PATH: ./configs/cdc.yml
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: shop
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      -  db_data:/var/lib/postgresql/data
      -  ./internal/infra/postgres/migrations:/docker-entrypoint-initdb.d
  redis:
    image: redis:7.2-alpine
    container_name: redis
    restart: always
    command: redis-server --requirepass mysecretpassword
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
volumes:
  redis_data:
  db_data: 
secrets:
  shared_bank_key:
    file: ./secrets/bank_key.txt
  jwt_key:
    file: ./secrets/jwt_key.txt